---
# Canonical application-routing inventory. Caddy, CoreDNS, Cloudflare DDNS,
# Pangolin's Newt Blueprint, and route validation all consume this file.
homelab_routing:
  schema_version: 1
  base_domain: homelab.example
  caddy_address: 10.42.0.202
  pangolin_vps_address: 198.51.100.24
  pangolin_home_site: home
  pangolin_local_site: complete-porcellio-scaber
  pocket_id_provider_id: 1
  unmanaged_route_targets:
    10.42.0.1: Physical router managed outside Ansible
    beszel: Docker service discovery inside the remote Pangolin site
  cloudflare_record:
    type: A
    ttl: 1
    proxied: false

  routes:
    - id: apex
      hostname: homelab.example
      public_target: home_dynamic

    - id: pocket-id
      hostname: auth.homelab.example
      internal_dns: true
      public_target: home_dynamic
      caddy:
        upstream: 10.42.0.207:1411
        health_path: /health
        expected_status: 200

    - id: jellyfin
      hostname: jf.homelab.example
      internal_dns: true
      public_target: home_dynamic
      caddy:
        upstream: 10.42.0.203:8096
        denied_paths: [/Users/authenticatebyname]
        health_path: /health
        expected_content: Healthy

    - id: matrix
      hostname: matrix.homelab.example
      public_target: pangolin_vps

    - id: matrix-rtc
      hostname: matrix-rtc.homelab.example
      public_target: pangolin_vps

    - id: miniflux
      hostname: rss.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: 10.42.0.206:8080
        internal_source_only: true
        auth_proxy_header: X-Miniflux-User
        auth_proxy_identity_header: Remote-User
        auth_proxy_user_mappings:
          11111111-1111-4111-8111-111111111111: household-reader
          22222222-2222-4222-8222-222222222222: jellyfin
        health_path: /
        expected_content: Miniflux
      pangolin:
        resource_id: droopy-japanese-badger
        name: Miniflux
        policy_id: harmful-forficula-smyrnensis
        roles: [Media]
        auto_login_idp: 1
        policy_rules:
          - { action: allow, match: path, value: /v1/*, enabled: true, priority: 1 }
          - { action: allow, match: path, value: /accounts/ClientLogin, enabled: true, priority: 2 }
          - { action: allow, match: path, value: /reader/api/0/*, enabled: true, priority: 3 }
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: router
      hostname: a.homelab.example
      internal_dns: true
      public_target: internal_caddy
      caddy:
        upstream: https://10.42.0.1:8443
        internal_source_only: true
        tls_insecure_skip_verify: true
        health_path: /
        expected_status: 200

    - id: shelfmark
      hostname: books.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: 10.42.0.204:8084
        internal_source_only: true
        health_path: /api/health
        expected_content: '"status":"ok"'
      pangolin:
        resource_id: precious-california-ground-squirrel
        name: Shelfmark
        policy_id: altruistic-carphophis-vermis
        roles: [Media]
        auto_login_idp: 1
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: filebrowser
      hostname: files.homelab.example
      internal_dns: true
      public_target: internal_caddy
      caddy:
        upstream: 10.42.0.205:8080
        internal_source_only: true
        health_path: /
        expected_content: File Browser

    - id: seerr
      hostname: jellyseerr.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: 10.42.0.204:5055
        internal_source_only: true
        health_path: /api/v1/status
        expected_content: '"version":"develop-local"'
      pangolin:
        resource_id: crooked-uperodon-taprobanicus
        name: Seerr
        policy_id: violent-chilean-rock-rat
        roles: [Media, Jellyfin]
        auto_login_idp: 1
        post_auth_path: /login?provider=pocketid
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: proxmox
      hostname: proxmox.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: https://10.42.0.99:8006
        internal_source_only: true
        tls_insecure_skip_verify: true
        openid_redirect:
          path: /sso
          realm: sso
        health_path: /
        expected_status: 200
      pangolin:
        resource_id: deficient-cliff-chipmunk
        name: Proxmox
        policy_id: frilly-alpine-chipmunk
        roles: [Infrastructure]
        auto_login_idp: 1
        post_auth_path: /sso
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: prowlarr
      hostname: prowlarr.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: 10.42.0.204:9696
        internal_source_only: true
        health_path: /ping
        expected_content: '"status": "OK"'
      pangolin:
        resource_id: fearful-black-capped-marmot
        name: Prowlarr
        policy_id: confused-anilius
        roles: [Media]
        auto_login_idp: 1
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: radarr
      hostname: radarr.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: 10.42.0.204:7878
        internal_source_only: true
        health_path: /ping
        expected_content: '"status": "OK"'
      pangolin:
        resource_id: stupid-sandhill-frog
        name: Radarr
        policy_id: detailed-flathead-worm-snake
        roles: [Media]
        auto_login_idp: 1
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: sonarr
      hostname: sonarr.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: 10.42.0.204:8989
        internal_source_only: true
        health_path: /ping
        expected_content: '"status": "OK"'
      pangolin:
        resource_id: blaring-mongolian-gerbil
        name: Sonarr
        policy_id: hateful-desert-tortoise
        roles: [Media]
        auto_login_idp: 1
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: transmission
      hostname: transmission.homelab.example
      internal_dns: true
      public_target: pangolin_vps
      caddy:
        upstream: 10.42.0.205:9091
        internal_source_only: true
        health_path: /transmission/web/
        expected_status: 200
      pangolin:
        resource_id: edible-european-mole
        name: Transmission
        policy_id: visible-hottentot-golden-mole
        roles: [Downloads]
        auto_login_idp: 1
        target: { site: home, hostname: 10.42.0.202, port: 443, method: https }

    - id: nerocd
      hostname: nerocd.homelab.example
      internal_dns: true
      public_target: internal_only
      caddy:
        upstream: 10.42.0.213:8080
        internal_source_only: true
        health_path: /api/v1/ready
        expected_status: 200
        expected_content: '"status":"ready"'

    - id: beszel
      hostname: beszel.homelab.example
      public_target: pangolin_vps
      pangolin:
        resource_id: mountainous-bunny-rat
        name: Beszel
        policy_id: early-ash-grey-mouse
        roles: [Infrastructure]
        auto_login_idp: 1
        policy_rules:
          - { action: allow, match: path, value: /api/beszel/agent-connect, enabled: true, priority: 1 }
        target: { site: complete-porcellio-scaber, hostname: beszel, port: 8090, method: http }

    - id: pangolin-dashboard
      hostname: pangolin.homelab.example
      public_target: pangolin_vps
