---
name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.21
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip sync requirements-dev.txt

      - name: Parse YAML
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path('.').rglob('*.yml')) + sorted(Path('.').rglob('*.yaml'))
          for path in paths:
              with path.open() as stream:
                  yaml.safe_load(stream)
          print(f'parsed {len(paths)} YAML files')
          PY

      - name: Run repository checks
        run: |
          uv run python -m unittest discover -s scripts -p 'test_*.py'
          uv run python scripts/validate_app_manifests.py
          uv run python scripts/validate_routes.py
          uv run python scripts/validate_infrastructure_ownership.py
          ./scripts/test-production-wrapper

