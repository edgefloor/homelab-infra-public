# Native Go executables plus installed-library roots from the deployment contract.
update_monitor_extra_go_binaries: []
update_monitor_go_binaries: "{{ ['/usr/local/bin/beszel-agent'] + update_monitor_extra_go_binaries }}"
update_monitor_config_dir: /tmp/homelab-security-config
update_monitor_external_guests:
  - {id: 112, name: next-plaid}
  - {id: 113, name: firecrawl}
  - {id: 115, name: eu-law-db}
