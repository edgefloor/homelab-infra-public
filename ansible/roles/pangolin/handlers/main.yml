---
- name: Restart nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: restarted
    enabled: true
  listen: Restart nftables

- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted
    enabled: true
  listen: Restart nftables
