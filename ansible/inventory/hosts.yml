---
all:
  vars:
    homelab_investigation_execution:
      controller_user: hermes-agent
      controller_home: /var/lib/hermes-agent
      investigator_user: zig
      investigator_home: /var/lib/zig
      shared_group: hermes-agent
      kanban_root: /var/lib/hermes-kanban
      capability_state: /var/lib/homelab-investigator
      observation_key: /var/lib/homelab-investigator/.ssh/id_ed25519
      known_hosts: /var/lib/homelab-investigator/.ssh/known_hosts
      workspace_root: /var/lib/homelab-investigator/jobs
      artifact_cache: /var/cache/homelab-investigations
      repository_root: /var/lib/homelab-investigator/repositories
    infrastructure_contract:
      schema_version: 1
      default_host_kind: opentofu_guest
      host_kinds:
        proxmox: proxmox_host
        pangolin: external_vps
  children:
    proxmox_hosts:
      hosts:
        proxmox:
          ansible_host: 10.42.0.99
          ansible_user: root
          ansible_password: "{{ lookup('env', 'PROXMOX_ROOT_PW') }}"
          beszel_agent_system_name: Proxmox
          beszel_agent_smart_devices: /dev/sda:sat,/dev/nvme0n1:nvme
          beszel_agent_linux_capabilities:
            - CAP_SYS_RAWIO
            - CAP_SYS_ADMIN
          homelab_agent_units:
            pveproxy: pveproxy.service
            pvedaemon: pvedaemon.service
          homelab_agent_evidence_config_roots:
            - /etc/pve
            - /etc/systemd/system
          homelab_agent_evidence_config_files:
            - /etc/pve/datacenter.cfg
            - /etc/pve/storage.cfg
            - /etc/pve/firewall/cluster.fw
    plan_runners:
      hosts:
        plan-runner:
          ansible_host: 10.42.0.200
          ansible_user: homelab-admin
          beszel_agent_system_name: Plan-runner
          homelab_agent_units:
            runner: actions.runner.edgefloor-homelab-infra.plan-runner.service
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    hermes_agents:
      hosts:
        hermes-agent:
          ansible_host: 10.42.0.201
          ansible_user: homelab-admin
          hermes_agent_required_features: [platform.matrix, memory.honcho]
          beszel_agent_system_name: Hermes Agent
          homelab_agent_units: {}
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    caddy_staging:
      hosts:
        caddy:
          ansible_host: 10.42.0.202
          ansible_user: homelab-admin
          beszel_agent_system_name: Caddy
          update_monitor_extra_go_binaries:
            - /usr/bin/caddy
            - /usr/bin/crowdsec
            - /usr/bin/crowdsec-firewall-bouncer
          homelab_agent_units:
            caddy: caddy.service
            crowdsec: crowdsec.service
            crowdsec-bouncer: crowdsec-firewall-bouncer.service
          homelab_agent_evidence_config_roots:
            - /etc/caddy
            - /etc/crowdsec
    media_automation:
      hosts:
        media-automation:
          ansible_host: 10.42.0.204
          ansible_user: homelab-admin
          beszel_agent_system_name: Media automation
          homelab_agent_units:
            seerr: seerr.service
            radarr: radarr.service
            sonarr: sonarr.service
            prowlarr: prowlarr.service
            shelfmark: shelfmark.service
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    jellyfin_servers:
      hosts:
        jellyfin:
          ansible_host: 10.42.0.203
          ansible_user: homelab-admin
          beszel_agent_system_name: Jellyfin
          homelab_agent_units:
            jellyfin: jellyfin.service
          homelab_agent_evidence_config_roots:
            - /etc/jellyfin
            - /etc/systemd/system
    download_servers:
      hosts:
        downloads:
          ansible_host: 10.42.0.205
          ansible_user: homelab-admin
          homelab_mask_unsupported_lxc_mounts: true
          beszel_agent_system_name: Downloads
          update_monitor_extra_go_binaries:
            - /usr/local/bin/filebrowser
          homelab_agent_units:
            transmission: transmission-daemon.service
            filebrowser: filebrowser.service
          homelab_agent_evidence_config_roots:
            - /etc/transmission-daemon
            - /etc/systemd/system
    miniflux_servers:
      hosts:
        miniflux:
          ansible_host: 10.42.0.206
          ansible_user: homelab-admin
          homelab_mask_unsupported_lxc_mounts: true
          beszel_agent_system_name: Miniflux
          update_monitor_extra_go_binaries:
            - /usr/bin/miniflux
            - /usr/local/bin/miniflux-mcp
            - /usr/local/bin/tunnel-client
          homelab_agent_units:
            miniflux: miniflux.service
            miniflux-mcp: miniflux-mcp.service
            openai-tunnel: tunnel-client.service
            postgresql: postgresql.service
          homelab_agent_evidence_config_roots:
            - /etc/miniflux
            - /etc/systemd/system
    pocket_id_servers:
      hosts:
        pocket-id:
          ansible_host: 10.42.0.207
          ansible_user: homelab-admin
          beszel_agent_system_name: Pocket ID
          update_monitor_extra_go_binaries:
            - /opt/pocket-id/pocket-id
          homelab_agent_units:
            pocket-id: pocketid.service
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    tuwunel_servers:
      hosts:
        pangolin:
          ansible_host: 198.51.100.24
          ansible_user: root
          # Keep external incident delivery disabled during the reviewed CVE rollout.
          vulnerability_incidents_publish: false
          vulnerability_incidents_lifecycle_publish_enabled: false
          beszel_agent_system_name: Pangolin VPS
          update_monitor_extra_go_binaries:
            - /usr/bin/crowdsec-firewall-bouncer
          update_monitor_release_notifier_enabled: true
          homelab_agent_units:
            tuwunel: tuwunel.service
            matrix-alerts: crowdsec-matrix-bridge.service
            matrix-rtc-livekit: docker.service
            crowdsec-bouncer: crowdsec-firewall-bouncer.service
          homelab_agent_evidence_config_roots:
            - /etc/tuwunel
            - /opt/matrix-rtc
            - /etc/crowdsec
            - /opt/pangolin/config
            - /etc/systemd/system
    pangolin_connectors:
      hosts:
        pangolin-connector:
          ansible_host: 10.42.0.210
          ansible_user: homelab-admin
          beszel_agent_system_name: Newt
          update_monitor_extra_go_binaries:
            - /usr/local/bin/newt
          homelab_agent_units:
            newt: newt.service
          homelab_agent_evidence_config_roots:
            - /etc/newt
            - /etc/systemd/system
    network_ops:
      hosts:
        network-ops:
          ansible_host: 10.42.0.211
          ansible_user: homelab-admin
          homelab_mask_unsupported_lxc_mounts: true
          beszel_agent_system_name: CoreDNS and DDNS
          update_monitor_extra_go_binaries:
            - /usr/local/bin/coredns
          homelab_agent_units:
            coredns: coredns.service
            cloudflare-ddns: cloudflare-ddns.service
          homelab_agent_evidence_config_roots:
            - /etc/coredns
            - /etc/systemd/system
    cve_helix_servers:
      hosts:
        helix:
          ansible_host: 10.42.0.212
          ansible_user: homelab-admin
          homelab_mask_unsupported_lxc_mounts: true
          beszel_agent_system_name: HelixDB
          homelab_agent_units:
            helix-cve: helix-cve.service
            helix-tunnel: helix-cve-reverse-tunnel.service
            docker: docker.service
          homelab_agent_evidence_config_roots:
            - /etc/helix-cve
            - /etc/systemd/system
    incident_servers:
      hosts:
        incident:
          ansible_host: 10.42.0.214
          ansible_user: homelab-admin
          homelab_mask_unsupported_lxc_mounts: true
          beszel_agent_system_name: Dependency-Track
          vulnerability_incidents_publish: false
          vulnerability_incidents_lifecycle_publish_enabled: false
          vulnerability_incidents_helix_endpoint: http://10.42.0.212:6969
          homelab_agent_units:
            incidents: homelab-incidents.service
            incident-forward: homelab-incidents-reverse-tunnel.service
          homelab_agent_evidence_config_roots:
            - /etc/homelab-incidents
            - /etc/systemd/system
    nerocd_servers:
      hosts:
        nerocd:
          ansible_host: 10.42.0.213
          ansible_user: homelab-admin
          beszel_agent_system_name: NeroCD
          homelab_agent_units:
            nerocd: nerocd.service
            docker: docker.service
          homelab_agent_evidence_config_roots:
            - /opt/nerocd/runtime
            - /etc/systemd/system
    firecrawl_servers:
      hosts:
        firecrawl:
          ansible_host: 10.42.0.215
          ansible_user: homelab-admin
          beszel_agent_system_name: Firecrawl and SearXNG
          homelab_agent_units:
            firecrawl: firecrawl.service
            docker: docker.service
          homelab_agent_evidence_config_roots:
            - /opt/firecrawl/runtime
            - /etc/systemd/system
    n8n_servers:
      hosts:
        n8n:
          ansible_host: 10.42.0.216
          ansible_user: homelab-admin
          homelab_mask_unsupported_lxc_mounts: true
          beszel_agent_system_name: n8n
          homelab_agent_units:
            n8n: n8n.service
          homelab_agent_evidence_config_roots:
            - /etc/n8n
            - /etc/systemd/system
    news_embeddings_servers:
      hosts:
        news-embeddings:
          ansible_host: 10.42.0.217
          ansible_user: homelab-admin
          homelab_mask_unsupported_lxc_mounts: true
          beszel_agent_system_name: News embeddings
          homelab_agent_units:
            news-embeddings: news-embeddings.service
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    remote_platform:
      hosts:
        pangolin:
          ansible_host: 198.51.100.24
          ansible_user: root
          vulnerability_incidents_publish: false
          vulnerability_incidents_lifecycle_publish_enabled: false
          beszel_agent_system_name: Pangolin VPS
          update_monitor_extra_go_binaries:
            - /usr/bin/crowdsec-firewall-bouncer
          update_monitor_release_notifier_enabled: true
          homelab_agent_units:
            tuwunel: tuwunel.service
            matrix-alerts: crowdsec-matrix-bridge.service
            matrix-rtc-livekit: docker.service
            crowdsec-bouncer: crowdsec-firewall-bouncer.service
          homelab_agent_evidence_config_roots:
            - /etc/tuwunel
            - /opt/matrix-rtc
            - /etc/crowdsec
            - /opt/pangolin/config
            - /etc/systemd/system
    homelab_agent_targets:
      children:
        hermes_agents:
        plan_runners:
        proxmox_hosts:
        caddy_staging:
        media_automation:
        jellyfin_servers:
        download_servers:
        miniflux_servers:
        pocket_id_servers:
        tuwunel_servers:
        pangolin_connectors:
        network_ops:
        cve_helix_servers:
        incident_servers:
        nerocd_servers:
        firecrawl_servers:
        n8n_servers:
        remote_platform:
    beszel_agents:
      children:
        plan_runners:
        hermes_agents:
        proxmox_hosts:
        caddy_staging:
        media_automation:
        jellyfin_servers:
        download_servers:
        miniflux_servers:
        pocket_id_servers:
        tuwunel_servers:
        pangolin_connectors:
        network_ops:
        cve_helix_servers:
        incident_servers:
        nerocd_servers:
        firecrawl_servers:
        n8n_servers:
        news_embeddings_servers:
        remote_platform:
