---
all:
  vars:
    infrastructure_contract:
      schema_version: 1
      default_host_kind: opentofu_guest
      host_kinds:
        proxmox: proxmox_host
        pangolin: external_vps
  children:
    proxmox_hosts:
      hosts:
        proxmox:
          ansible_host: 10.42.0.99
          ansible_user: root
          ansible_password: "{{ lookup('env', 'PROXMOX_ROOT_PW') }}"
          beszel_agent_system_name: Proxmox
          beszel_agent_smart_devices: /dev/sda:sat,/dev/nvme0n1:nvme
          beszel_agent_linux_capabilities:
            - CAP_SYS_RAWIO
            - CAP_SYS_ADMIN
          homelab_agent_units:
            pveproxy: pveproxy.service
            pvedaemon: pvedaemon.service
          homelab_agent_evidence_config_roots:
            - /etc/pve
            - /etc/systemd/system
    plan_runners:
      hosts:
        plan-runner:
          ansible_host: 10.42.0.200
          ansible_user: homelab-admin
          update_monitor_go_binaries: []
          beszel_agent_system_name: Plan-runner
          homelab_agent_units:
            agent: homelab-agent.service
            runner: actions.runner.edgefloor-homelab-infra.plan-runner.service
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    caddy_staging:
      hosts:
        caddy:
          ansible_host: 10.42.0.202
          ansible_user: homelab-admin
          beszel_agent_system_name: Caddy
          update_monitor_extra_go_binaries:
            - /usr/bin/caddy
            - /usr/bin/crowdsec
            - /usr/bin/crowdsec-firewall-bouncer
          homelab_agent_units:
            caddy: caddy.service
            crowdsec: crowdsec.service
            crowdsec-bouncer: crowdsec-firewall-bouncer.service
          homelab_agent_evidence_config_roots:
            - /etc/caddy
            - /etc/crowdsec
    media_automation:
      hosts:
        media-automation:
          ansible_host: 10.42.0.204
          ansible_user: homelab-admin
          beszel_agent_system_name: Media automation
          homelab_agent_units:
            seerr: seerr.service
            radarr: radarr.service
            sonarr: sonarr.service
            prowlarr: prowlarr.service
            shelfmark: shelfmark.service
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    jellyfin_servers:
      hosts:
        jellyfin:
          ansible_host: 10.42.0.203
          ansible_user: homelab-admin
          beszel_agent_system_name: Jellyfin
          homelab_agent_units:
            jellyfin: jellyfin.service
          homelab_agent_evidence_config_roots:
            - /etc/jellyfin
            - /etc/systemd/system
    download_servers:
      hosts:
        downloads:
          ansible_host: 10.42.0.205
          ansible_user: homelab-admin
          beszel_agent_system_name: Downloads
          update_monitor_extra_go_binaries:
            - /usr/local/bin/filebrowser
          homelab_agent_units:
            transmission: transmission-daemon.service
            filebrowser: filebrowser.service
          homelab_agent_evidence_config_roots:
            - /etc/transmission-daemon
            - /etc/systemd/system
    miniflux_servers:
      hosts:
        miniflux:
          ansible_host: 10.42.0.206
          ansible_user: homelab-admin
          beszel_agent_system_name: Miniflux
          update_monitor_extra_go_binaries:
            - /usr/bin/miniflux
            - /usr/local/bin/miniflux-mcp
            - /usr/local/bin/tunnel-client
          homelab_agent_units:
            miniflux: miniflux.service
            miniflux-mcp: miniflux-mcp.service
            openai-tunnel: tunnel-client.service
            postgresql: postgresql.service
          homelab_agent_evidence_config_roots:
            - /etc/miniflux
            - /etc/systemd/system
    pocket_id_servers:
      hosts:
        pocket-id:
          ansible_host: 10.42.0.207
          ansible_user: homelab-admin
          beszel_agent_system_name: Pocket ID
          update_monitor_extra_go_binaries:
            - /opt/pocket-id/pocket-id
          homelab_agent_units:
            pocket-id: pocketid.service
          homelab_agent_evidence_config_roots:
            - /etc/systemd/system
    tuwunel_servers:
      hosts:
        pangolin:
          ansible_host: 198.51.100.24
          ansible_user: root
          beszel_agent_system_name: Pangolin VPS
          update_monitor_extra_go_binaries:
            - /usr/bin/crowdsec-firewall-bouncer
          update_monitor_release_notifier_enabled: true
          homelab_agent_units:
            tuwunel: tuwunel.service
            matrix-alerts: crowdsec-matrix-bridge.service
            matrix-rtc-livekit: docker.service
            crowdsec-bouncer: crowdsec-firewall-bouncer.service
          homelab_agent_evidence_config_roots:
            - /etc/tuwunel
            - /etc/matrix-rtc
            - /opt/matrix-rtc
            - /etc/crowdsec
            - /opt/pangolin/config
            - /etc/systemd/system
    pangolin_connectors:
      hosts:
        pangolin-connector:
          ansible_host: 10.42.0.210
          ansible_user: homelab-admin
          beszel_agent_system_name: Newt
          update_monitor_extra_go_binaries:
            - /usr/local/bin/newt
          homelab_agent_units:
            newt: newt.service
          homelab_agent_evidence_config_roots:
            - /etc/newt
            - /etc/systemd/system
    network_ops:
      hosts:
        network-ops:
          ansible_host: 10.42.0.211
          ansible_user: homelab-admin
          beszel_agent_system_name: CoreDNS and DDNS
          update_monitor_extra_go_binaries:
            - /usr/local/bin/coredns
          homelab_agent_units:
            coredns: coredns.service
            cloudflare-ddns: cloudflare-ddns.service
          homelab_agent_evidence_config_roots:
            - /etc/coredns
            - /etc/systemd/system
    nerocd_servers:
      hosts:
        nerocd:
          ansible_host: 10.42.0.213
          ansible_user: homelab-admin
          beszel_agent_system_name: NeroCD
          homelab_agent_units:
            nerocd: nerocd.service
            docker: docker.service
          homelab_agent_evidence_config_roots:
            - /opt/nerocd/runtime
            - /etc/systemd/system
    remote_platform:
      hosts:
        pangolin:
          ansible_host: 198.51.100.24
          ansible_user: root
          beszel_agent_system_name: Pangolin VPS
          update_monitor_extra_go_binaries:
            - /usr/bin/crowdsec-firewall-bouncer
          update_monitor_release_notifier_enabled: true
          homelab_agent_units:
            tuwunel: tuwunel.service
            matrix-alerts: crowdsec-matrix-bridge.service
            matrix-rtc-livekit: docker.service
            crowdsec-bouncer: crowdsec-firewall-bouncer.service
          homelab_agent_evidence_config_roots:
            - /etc/tuwunel
            - /etc/matrix-rtc
            - /opt/matrix-rtc
            - /etc/crowdsec
            - /opt/pangolin/config
            - /etc/systemd/system
    homelab_agent_targets:
      children:
        plan_runners:
        proxmox_hosts:
        caddy_staging:
        media_automation:
        jellyfin_servers:
        download_servers:
        miniflux_servers:
        pocket_id_servers:
        tuwunel_servers:
        pangolin_connectors:
        network_ops:
        nerocd_servers:
        remote_platform:
    beszel_agents:
      children:
        proxmox_hosts:
        caddy_staging:
        media_automation:
        jellyfin_servers:
        download_servers:
        miniflux_servers:
        pocket_id_servers:
        tuwunel_servers:
        pangolin_connectors:
        network_ops:
        nerocd_servers:
        remote_platform:
