---
- name: Publish n8n in the canonical DNS records
  hosts: network_ops
  become: true
  vars_files:
    - ../../inventory/routes.yml
  roles:
    - cloudflare_ddns
  tasks:
    - name: Derive the internal host map
      ansible.builtin.set_fact:
        coredns_internal_hosts: "{{ (coredns_internal_hosts | default([])) + [{'address': homelab_routing.caddy_address, 'hostname': item.hostname}] }}"
      loop: "{{ homelab_routing.routes }}"
      when: item.internal_dns | default(false)
      loop_control:
        label: "{{ item.hostname }}"

    - name: Publish the internal host map
      ansible.builtin.template:
        src: ../roles/coredns/templates/internal.hosts.j2
        dest: /etc/coredns/internal.hosts
        owner: root
        group: coredns
        mode: '0640'
      register: n8n_internal_hosts

    - name: Reload internal DNS hosts
      ansible.builtin.systemd_service:
        name: coredns.service
        state: restarted
      when: n8n_internal_hosts.changed

- name: Publish the n8n Caddy route
  hosts: caddy_staging
  become: true
  vars_files:
    - ../../inventory/routes.yml
    - ../roles/caddy/defaults/main.yml
  tasks:
    - name: Derive Caddy routes
      ansible.builtin.set_fact:
        caddy_routes: "{{ (caddy_routes | default([])) + [item.caddy | combine({'hostname': item.hostname})] }}"
      loop: "{{ homelab_routing.routes }}"
      when: item.caddy is defined
      loop_control:
        label: "{{ item.hostname }}"

    - name: Validate and publish the Caddy routes
      ansible.builtin.template:
        src: ../roles/caddy/templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: '0640'
        validate: /usr/bin/caddy validate --envfile /etc/caddy/cloudflare.env --config %s --adapter caddyfile
        backup: true
      register: n8n_caddy_routes

    - name: Reload Caddy
      ansible.builtin.systemd_service:
        name: caddy.service
        state: reloaded
      when: n8n_caddy_routes.changed

    - name: Check n8n through Caddy HTTPS
      ansible.builtin.command:
        argv: [curl, --fail, --silent, --show-error, --resolve, 'n8n.homelab.example:443:127.0.0.1', 'https://n8n.homelab.example/healthz/readiness']
      changed_when: false

- name: Publish the n8n Pangolin resource
  hosts: pangolin_connectors
  become: true
  vars_files:
    - ../../inventory/routes.yml
  tasks:
    - name: Publish the reconciled resource Blueprint
      ansible.builtin.template:
        src: ../roles/newt/templates/routes-blueprint.yml.j2
        dest: /etc/newt/routes-blueprint.yml
        owner: root
        group: root
        mode: '0640'
        backup: true
      register: n8n_blueprint

    - name: Reconcile the Pangolin resource
      ansible.builtin.systemd_service:
        name: newt.service
        state: restarted
      when: n8n_blueprint.changed
