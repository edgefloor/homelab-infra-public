---
- name: Match Hermes scanner arguments to its declared installations
  hosts: hermes_agents
  become: true
  gather_facts: false
  vars_files:
    - ../roles/update_monitor/defaults/main.yml
  pre_tasks:
    - name: Require explicit opt-in to the retired custom CVE pipeline
      ansible.builtin.import_role:
        name: legacy_cve_guard
      tags: [always]
  tasks:
    - name: Require the scanner to be idle
      ansible.builtin.command: systemctl is-active homelab-cve-monitor.service
      register: scanner
      changed_when: false
      failed_when: scanner.stdout in ['active', 'activating']
    - name: Install the corrected scanner command without touching credentials or drop-ins
      ansible.builtin.template:
        src: ../roles/update_monitor/templates/homelab-cve-monitor.service.j2
        dest: /etc/systemd/system/homelab-cve-monitor.service
        mode: '0644'
        backup: true
      vars:
        update_monitor_go_binaries: []
    - name: Reload the scanner declaration
      ansible.builtin.systemd_service:
        daemon_reload: true
