<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff335f" />
    <title>Definitely Not a Rickroll</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080511;
        color: #fff7f0;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 51, 95, 0.42), transparent 30%),
          radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.4), transparent 35%),
          #080511;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        opacity: 0.15;
        pointer-events: none;
        background-image: linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px);
        background-size: 48px 48px;
        transform: perspective(500px) rotateX(55deg) scale(1.6) translateY(28%);
        transform-origin: bottom;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(92vw, 960px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #ffcf33;
        font-size: clamp(.72rem, 2vw, .92rem);
        font-weight: 800;
        letter-spacing: .2em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 820px;
        margin: 0 auto 16px;
        font-size: clamp(3rem, 10vw, 7.5rem);
        line-height: .87;
        letter-spacing: -.07em;
        text-wrap: balance;
      }

      .accent {
        color: transparent;
        -webkit-text-stroke: 2px #ff335f;
        filter: drop-shadow(4px 4px 0 #4b4cff);
      }

      .lede {
        margin: 0 auto 28px;
        max-width: 600px;
        color: #d7cfe3;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 18px 30px;
        font: inherit;
        font-weight: 900;
        color: #080511;
        background: #ffcf33;
        box-shadow: 0 8px 0 #ad7315, 0 18px 50px rgba(255, 207, 51, .3);
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease;
      }

      button:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 11px 0 #ad7315, 0 22px 55px rgba(255, 207, 51, .38); }
      button:active { transform: translateY(5px); box-shadow: 0 3px 0 #ad7315; }

      .video-shell {
        position: fixed;
        left: -200vw;
        opacity: 0;
        pointer-events: none;
        width: min(90vw, 900px);
        margin: 0 auto;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 4px solid #fff7f0;
        border-radius: 22px;
        background: #000;
        box-shadow: 14px 14px 0 #ff335f, -14px -14px 0 #4b4cff, 0 30px 80px #000;
      }

      .video-shell iframe { width: 100%; height: 100%; border: 0; }

      .revealed .intro { display: none; }
      .revealed .video-shell {
        position: relative;
        left: auto;
        opacity: 1;
        pointer-events: auto;
        animation: reveal .5s cubic-bezier(.2, 1.6, .4, 1);
      }

      .sticker {
        position: fixed;
        right: 3vw;
        top: 4vh;
        z-index: 2;
        padding: 10px 14px;
        color: #080511;
        background: #7cff6b;
        font-weight: 900;
        transform: rotate(7deg);
        box-shadow: 5px 5px 0 #080511;
      }

      .fallback { margin-top: 22px; color: #cfc6db; }
      .fallback a { color: #ffcf33; }

      @keyframes reveal {
        from { opacity: 0; transform: scale(.72) rotate(-4deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <span class="sticker">100% LEGIT</span>
    <main id="stage">
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">Congratulations, internet traveler</p>
        <h1 id="title">You found the <span class="accent">secret prize</span></h1>
        <p class="lede">One click. Zero regrets. A life-changing audiovisual experience awaits.</p>
        <button id="reveal" type="button">Claim my prize →</button>
      </section>

      <section class="video-shell" aria-label="Your surprise">
        <iframe
          id="video"
          title="Your surprise"
          src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?controls=0&amp;autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=dQw4w9WgXcQ&amp;playsinline=1&amp;enablejsapi=1"
          allow="autoplay; encrypted-media"
          allowfullscreen
        ></iframe>
      </section>
      <p class="fallback" hidden>If the video is blocked, <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">open your prize here</a>.</p>
    </main>

    <script>
      const stage = document.querySelector("#stage");
      const button = document.querySelector("#reveal");
      const video = document.querySelector("#video");
      const fallback = document.querySelector(".fallback");

      function controlVideo(command) {
        video.contentWindow.postMessage(
          JSON.stringify({ event: "command", func: command, args: [] }),
          "*",
        );
      }

      button.addEventListener("click", () => {
        stage.classList.add("revealed");
        fallback.hidden = false;
        controlVideo("unMute");
        controlVideo("playVideo");
        controlVideo("hideControls");
      });
    </script>
  </body>
</html>
