---
schema_version: 1
id: openai-tunnel-client
name: OpenAI Tunnel Client
upstream:
  repository: https://github.com/openai/tunnel-client
  release: v0.0.14
  commit: 0f870e50a973fa820d4c409000059e181e8d242b
  distribution: official_binary
runtime: native_systemd
environments:
  staging: { target: miniflux, status: migrated_and_validated }
  production: { target: miniflux, status: active_outbound_integration }
routing: { caddy: none, pangolin: none }
health:
  local_url: http://127.0.0.1:8082/
  expected_units: [tunnel-client.service]
state:
  paths: [/etc/tunnel-client.env, /root/.config/tunnel-client/miniflux.yaml]
  backup_required_before_cutover: true
